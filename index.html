<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Nations Headquarters, 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a33; --muted:#4a5a64;
  --glass:rgba(240,244,246,.76); --glass-edge:rgba(255,255,255,.65);
  --chip-on:rgba(190,206,218,.95);
  --pill:rgba(24,34,44,.66); --pill-text:#f3f6f8;
  --sky:#c8d6e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#e7edf2;--muted:#a9b6c0;--glass:rgba(20,28,38,.66);--glass-edge:rgba(255,255,255,.12);--chip-on:rgba(96,124,150,.55);--pill:rgba(6,10,16,.66);}
}
:root[data-theme="dark"]{--ink:#e7edf2;--muted:#a9b6c0;--glass:rgba(20,28,38,.66);--glass-edge:rgba(255,255,255,.12);--chip-on:rgba(96,124,150,.55);--pill:rgba(6,10,16,.66);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.mist{position:fixed;left:0;right:0;top:0;height:30vh;pointer-events:none;background:linear-gradient(to bottom,var(--sky) 0%,transparent 100%);opacity:.85}
.floor{position:fixed;left:0;right:0;bottom:0;height:24vh;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(10,16,22,.78))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}

.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:18px clamp(16px,3vw,36px) 0;
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(28px,4.4vw,48px);line-height:1.02;color:var(--ink)}
.sub{margin:6px 0 0;font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.controls{display:flex;flex-direction:column;gap:10px;align-items:flex-end;width:min(100%,460px)}
.seg{display:flex;gap:2px;padding:5px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--ink)}
.seg.wide{width:100%}
.seg.small button{padding:8px 16px;font-size:17px;line-height:1}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;padding:10px 18px;border-radius:999px;background:var(--pill);color:var(--pill-text);
  font-weight:600;font-size:14.5px;letter-spacing:.03em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);
  white-space:nowrap;will-change:transform;transition:background .25s,opacity .25s}
.tag:hover,.tag.on{background:rgba(48,92,140,.88)}
.dim .tag:not(.on){opacity:.35}

.bottom{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 clamp(16px,3vw,36px) 12px;display:flex;align-items:center;gap:6px 26px;flex-wrap:wrap;color:#f1f4f6}
.bottom .places{display:flex;gap:6px 22px;flex-wrap:wrap}
.bottom button{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:19px;letter-spacing:.03em;padding:6px 0;color:rgba(241,244,246,.82);border-bottom:2px solid transparent}
.bottom button:hover{color:#fff}
.bottom button[aria-current="true"]{color:#fff;border-bottom-color:#fff}
.bottom .sep{width:1px;height:20px;background:rgba(255,255,255,.35)}
.bottom .tools{display:flex;gap:22px;align-items:center}

#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translateX(-50%);padding:9px 18px;border-radius:999px;
  background:var(--pill);color:var(--pill-text);font-weight:600;font-size:13.5px;letter-spacing:.03em;pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .5s}

#panel{position:fixed;left:clamp(16px,3vw,36px);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(390px,calc(100% - 32px));padding:22px 24px 20px;border-radius:20px;
  background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#panel.open{opacity:1;transform:none;pointer-events:auto}
#panel h2{margin:0 0 8px;font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;line-height:1.05;font-weight:600}
#panel p{margin:0 0 16px;line-height:1.55;font-size:15.5px;max-width:38ch}
#panel .row{display:flex;gap:8px;flex-wrap:wrap}
#panel .btn{padding:9px 16px;border-radius:12px;background:var(--chip-on);font-weight:600;font-size:14px}
#panel .btn.go{background:#2f5d8c;color:#fff}
#nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:18px}

/* ---------- inside the chamber ---------- */
body.inside .top,body.inside .bottom,body.inside #labels,body.inside #panel,body.inside .mist,body.inside .floor,body.inside #hint{display:none}
#room{display:none;color:#eef3f7}
body.inside #room{display:block}
.rglass{background:rgba(10,16,24,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#session{position:fixed;left:clamp(14px,2.4vw,30px);top:calc(env(safe-area-inset-top,0px) + 16px);padding:10px 16px;border-radius:14px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#c9d6e0}
#session b{display:block;font-family:"Cormorant Garamond",Georgia,serif;text-transform:none;letter-spacing:.01em;font-size:22px;color:#fff;margin-top:2px}
#ticker{position:fixed;right:clamp(14px,2.4vw,30px);top:calc(env(safe-area-inset-top,0px) + 16px);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;letter-spacing:.08em;display:flex;gap:10px;align-items:baseline}
#ticker .p{font-size:20px;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums}
#ticker .d{font-variant-numeric:tabular-nums}
#ticker .d.up{color:#7fd6a0} #ticker .d.down{color:#ff8a7a}
#ticker.shock{animation:shock .6s 3}
@keyframes shock{50%{background:rgba(150,30,30,.75)}}
#cards{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.acard{position:absolute;left:0;top:0;width:250px;padding:10px 13px 11px;border-radius:14px;font-size:12.5px;line-height:1.35;will-change:transform;transition:opacity .4s,border-color .4s,box-shadow .4s}
.acard .nm{font-weight:600;font-size:14.5px;color:#fff}
.acard .rl{color:#b7c5cf;margin-top:1px}
.acard .bd{display:inline-flex;gap:6px;align-items:center;margin-top:7px;padding:4px 9px;border-radius:999px;font-weight:600;font-size:11.5px;letter-spacing:.02em}
.bd.ok{background:rgba(60,160,110,.25);color:#8fe2b4}
.bd.check{background:rgba(220,170,60,.22);color:#f2cf7c}
.bd.fail{background:rgba(220,60,60,.3);color:#ffaaa0}
.bd.held{background:rgba(230,150,40,.25);color:#ffc77a}
.bd.human{background:rgba(255,255,255,.12);color:#e6edf2}
.acard.speaking{border-color:rgba(140,200,255,.6);box-shadow:0 0 0 1px rgba(140,200,255,.35),0 8px 30px rgba(40,120,200,.25)}
.acard.alert{border-color:rgba(255,110,100,.75);box-shadow:0 0 24px rgba(255,80,70,.35)}
.mand{margin-top:8px;font-size:11px;color:#b7c5cf}
.mand .bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:visible}
.mand .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#6fb6e8;transition:width .8s,background .4s}
.mand .fill.over{background:#f0a23c}
.mand .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;left:80%}
#analysis{position:fixed;right:clamp(14px,2.4vw,30px);top:calc(env(safe-area-inset-top,0px) + 76px);width:min(300px,40vw);padding:14px 16px;border-radius:16px;transition:opacity .4s}
#analysis h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#9fc6e6;font-weight:600}
#analysis ul{margin:0;padding:0;list-style:none}
#analysis li{font-size:13.5px;line-height:1.4;padding:6px 0;border-top:1px solid rgba(255,255,255,.08);opacity:0;transform:translateY(4px);animation:li .5s forwards}
#analysis li:first-child{border-top:0}
@keyframes li{to{opacity:1;transform:none}}
#sub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(820px,calc(100% - 28px));padding:16px 20px 12px;border-radius:18px;transition:opacity .35s}
#sub .who{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#9fc6e6}
#sub .who.c{color:#ffaaa0}
#sub p{margin:6px 0 4px;font-size:clamp(16px,1.9vw,19px);line-height:1.5;color:#fff;min-height:3em}
#sub .note{font-size:12.5px;color:#9fb0bc;min-height:1.2em}
#sub .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.rb{padding:7px 14px;border-radius:10px;background:rgba(255,255,255,.1);font-weight:600;font-size:13.5px;color:#eef3f7}
.rb:hover{background:rgba(255,255,255,.18)}
.rb.pri{background:#2f6ea8}
.rb.pri:hover{background:#3a7fbf}
#sub .step{font-size:12.5px;color:#9fb0bc;font-variant-numeric:tabular-nums;margin:0 4px}
#sub .sp{flex:1}
#story{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(4,8,14,.45)}
#story.show{display:grid}
#story .box{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:28px 30px 24px;border-radius:22px}
#story .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#9fc6e6;font-weight:600}
#story h2{margin:6px 0 12px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.05;color:#fff}
#story p{margin:0 0 12px;line-height:1.6;font-size:15.5px;color:#dbe4ea}
#story .q{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(21px,2.6vw,26px);line-height:1.3;color:#fff;border-left:3px solid #6fb6e8;padding-left:14px;margin:4px 0 18px}
#story ul{margin:0 0 16px;padding:0;list-style:none}
#story li{padding:8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14.5px;line-height:1.5;color:#dbe4ea}
#story li b{color:#fff}
#story .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#fade{position:fixed;inset:0;background:#05080d;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .8s;color:#cfdbe4;text-align:center;padding:24px}
#fade.on{opacity:1;pointer-events:auto}
#fade p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(24px,3.4vw,36px);color:#fff}
#fade span{display:block;margin-top:8px;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:#9fc6e6}

@media (max-width:700px){
  .controls{width:100%;align-items:stretch}
  .seg button{padding:10px 6px;font-size:13px;gap:5px}
  .seg.small{align-self:flex-end;width:auto}
  .tag{padding:9px 14px;font-size:13.5px}
  .bottom{gap:2px 16px}
  .bottom button{font-size:17px}
  #panel{bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
  #analysis{display:none}
  .acard{width:190px;font-size:11.5px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
}
@media (prefers-reduced-motion: reduce){
  #panel,.tag,.seg button,#fade,#analysis li{transition:none;animation:none;opacity:1}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Interactive 3D model of the United Nations Headquarters in New York. Drag to rotate, scroll or pinch to zoom. Scroll in on the UN to enter the negotiation."></canvas>
<div class="mist"></div><div class="floor"></div>
<div id="labels"></div>

<header class="top">
  <div>
    <h1>United Nations Headquarters</h1>
    <p class="sub">First Avenue, New York City &middot; 2050</p>
  </div>
  <div class="controls">
    <div class="seg wide" id="seasons" role="group" aria-label="Season">
      <button data-season="spring" aria-pressed="true">&#10048; Spring</button>
      <button data-season="summer" aria-pressed="false">&#9728;&#65038; Summer</button>
      <button data-season="autumn" aria-pressed="false">&#10047; Autumn</button>
      <button data-season="winter" aria-pressed="false">&#10052;&#65038; Winter</button>
    </div>
    <div class="seg small" id="daynight" role="group" aria-label="Time of day">
      <button data-n="0" aria-pressed="true" aria-label="Day">&#9728;&#65038;</button>
      <button data-n="1" aria-pressed="false" aria-label="Night">&#9790;</button>
    </div>
  </div>
</header>

<div id="hint">Scroll in on the UN to step inside the negotiation</div>

<aside id="panel" aria-live="polite">
  <h2 id="pTitle"></h2>
  <p id="pText"></p>
  <div class="row">
    <button class="btn go" id="pEnter">Step inside the negotiation</button>
    <button class="btn" id="pBack">Back to the map</button>
  </div>
</aside>

<nav class="bottom" aria-label="Places">
  <div class="places" id="places"></div>
  <div class="tools">
    <button data-go="map" aria-current="true">Map</button>
    <span class="sep" aria-hidden="true"></span>
    <button data-go="visit">Visit</button>
  </div>
</nav>

<!-- negotiation chamber UI -->
<div id="room">
  <div id="session" class="rglass">Emergency session &middot; New York, 2050<b>International Oil Trade</b></div>
  <div id="ticker" class="rglass">BRENT CRUDE <span class="p" id="tkP">$141.80</span><span class="d up" id="tkD">&#9650; 0.4%</span></div>
  <div id="cards"></div>
  <aside id="analysis" class="rglass" aria-live="polite"><h3>Live analysis</h3><ul id="anList"></ul></aside>
  <div id="sub" class="rglass" aria-live="polite">
    <div class="who" id="subWho"></div>
    <p id="subText"></p>
    <div class="note" id="subNote"></div>
    <div class="ctl">
      <button class="rb" id="bPrev">&#9664; Back</button>
      <span class="step" id="bStep"></span>
      <button class="rb pri" id="bNext">Next &#9654;</button>
      <span class="sp"></span>
      <button class="rb" id="bVoice" aria-pressed="false">Voices: off</button>
      <button class="rb" id="bExit">Leave the chamber</button>
    </div>
  </div>
  <div id="story"><div class="box rglass" id="storyBox"></div></div>
</div>
<div id="fade"><div><p id="fadeT"></p><span id="fadeS"></span></div></div>
<div id="nogl">Your browser couldn’t start 3D graphics, so the scene can’t be shown here.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
(function(){
"use strict";
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
var canvas=document.getElementById('c'), renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});}
catch(err){document.getElementById('nogl').style.display='grid';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var maxAniso=renderer.capabilities.getMaxAnisotropy();

var scene=new THREE.Scene();
scene.background=new THREE.Color(0xc8d6e2);
scene.fog=new THREE.Fog(0xc8d6e2,150,600);
var camera=new THREE.PerspectiveCamera(36,1,1,3000);
var controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=12; controls.maxDistance=340;
controls.minPolarAngle=.2; controls.maxPolarAngle=1.4;
controls.screenSpacePanning=false; controls.rotateSpeed=.6; controls.panSpeed=.9; controls.zoomSpeed=2;

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry32(42);
function R(a,b){return a+rnd()*(b-a);}
function std(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o||{}));}
function add(geo,mat,x,y,z,parent,noCast){var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(parent||scene).add(m);m.castShadow=!noCast;m.receiveShadow=true;return m;}
function grp(x,y,z,ry,parent){var g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry||0;(parent||scene).add(g);return g;}
function Box(w,h,d){return new THREE.BoxGeometry(w,h,d);}
function Cyl(a,b,h,s){return new THREE.CylinderGeometry(a,b,h,s||8);}
function cnv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(cv,rep){var t=new THREE.CanvasTexture(cv);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=maxAniso;return t;}

/* ---------- sky reflections for glass and water ---------- */
var envTex=(function(){
  var es=new THREE.Scene(), g=new THREE.SphereGeometry(100,32,16), p=g.attributes.position, col=new Float32Array(p.count*3), c=new THREE.Color(),
      top=new THREE.Color(0x86acd2), hor=new THREE.Color(0xe8eef2), gnd=new THREE.Color(0x4a4f53);
  for(var i=0;i<p.count;i++){var y=p.getY(i)/100;if(y>=0)c.copy(hor).lerp(top,Math.pow(y,.6));else c.copy(hor).lerp(gnd,Math.min(1,-y*4));col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  var pm=new THREE.PMREMGenerator(renderer), t=pm.fromScene(es,.02).texture; pm.dispose(); return t;
})();
var GLASS=[], NIGHT=[];
function glassMat(o){var m=std(0xffffff,Object.assign({roughness:.22,metalness:.4,envMap:envTex,envMapIntensity:1},o||{}));m.userData.env=m.envMapIntensity;GLASS.push(m);return m;}

/* ---------- facade textures (day + lit-window night version share one layout) ---------- */
function facade(o){
  var W=o.w||256,H=o.h||256,c=cnv(W,H),c2=cnv(W,H),x=c.getContext('2d'),y=c2.getContext('2d'),r=mulberry32(o.seed||7);
  x.fillStyle=o.wall;x.fillRect(0,0,W,H);y.fillStyle='#000';y.fillRect(0,0,W,H);
  if(o.noise){for(var n=0;n<W*H/30;n++){x.fillStyle=r()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';x.fillRect(r()*W,r()*H,2,1);}}
  var fh=H/o.floors,bw=W/o.bays;
  for(var f=0;f<o.floors;f++){
    var top=f*fh;
    if(o.bands&&o.bands[f]){x.fillStyle=o.band;x.fillRect(0,top,W,fh);x.fillStyle='rgba(0,0,0,.35)';for(var gx=0;gx<W;gx+=4)x.fillRect(gx,top,2,fh);continue;}
    for(var b=0;b<o.bays;b++){
      var l=b*bw,wx,wy,ww,wh;
      if(o.punch){wx=l+bw*o.punch[0];wy=top+fh*o.punch[1];ww=bw*(1-2*o.punch[0]);wh=fh*(1-o.punch[1]-o.punch[2]);}
      else{wx=l;wy=top;ww=bw;wh=fh*(1-(o.spand||0));}

    a.aL.sh.rotation.set(-.32+br,0,.06);a.aL.el.rotation.x=-.75;
    if(talk){a.aR.sh.rotation.set(-.7+.25*Math.sin(t*2.3),0,-.22-.08*Math.sin(t*1.7));a.aR.el.rotation.x=-1.05+.3*Math.sin(t*3.1);}
    else{a.aR.sh.rotation.set(-.32+br,0,-.06);a.aR.el.rotation.x=-.75;}
  }
}
function renderRoom(dt){
  if(BEATS[beat].card){
    // slow overhead orbit behind the story cards; remember where it is so the next move starts from here
    var oa=reduce?Math.PI/2:Math.PI/2-time*.06;camCur=Object.assign({},CAMS.wide,{phi:oa});camFrom=null;camT=1;placeCam(camCur);
  }else{
    if(camFrom&&camT<1){camT=Math.min(1,camT+dt/(reduce?.01:2.2));var e=ease(camT);
      CK.forEach(function(k){camCur[k]=k==='phi'?camFrom.phi+camFrom.dphi*e:camFrom[k]+(camTo[k]-camFrom[k])*e;});}
    else if(camTo)CK.forEach(function(k){camCur[k]=camTo[k];});
    placeCam(camCur,reduce?0:Math.sin(time*.25)*.015);
  }
  globe.rotation.y+=dt*.25*(reduce?0:1);
  Object.keys(AV).forEach(function(k){animatePerson(AV[k],dt);});
  ['A','B','C','chair'].forEach(function(k){spots[k].intensity+=((AV[k].talk?1.6:.55)*(k==='C'?AV.C.vis:1)-spots[k].intensity)*Math.min(1,dt*3);});
  // ticker
  priceShown+=(price-priceShown)*Math.min(1,dt*(reduce?30:2.5));$('tkP').textContent='$'+priceShown.toFixed(2);
  // cards above heads
  var w=window.innerWidth,h=window.innerHeight,card=!!BEATS[beat].card,AVOID=['session','ticker','analysis'].map(function(id){var e=$(id);return getComputedStyle(e).display==='none'||e.style.opacity==='0'?null:e.getBoundingClientRect();});
  Object.keys(cardEls).forEach(function(k){
    var el=cardEls[k],a=AV[k];
    if(card||(k==='C'&&a.vis<.3)){el.style.opacity=0;return;}
    v3.set(0,a.seated?1.65:2.25,0);a.holder.localToWorld(v3);v3.project(rcam);
    if(v3.z>1||v3.z<-1||v3.x<-1.2||v3.x>1.2){el.style.opacity=0;return;}
    el.style.opacity=k==='chair'&&BEATS[beat].who!=='chair'?.75:1;
    var x=(v3.x*.5+.5)*w,y=(-v3.y*.5+.5)*h,cw=el.offsetWidth,chh=el.offsetHeight;x=Math.max(cw/2+12,Math.min(w-cw/2-12,x));y=Math.max(chh+12,y);
    AVOID.forEach(function(r){if(!r||r.width===0)return;var l=x-cw/2,t=y-chh;if(l<r.right+8&&l+cw>r.left-8&&t<r.bottom+8&&y>r.top-8){if(r.width<300){y=r.bottom+8+chh;}else if(r.left>w/2)x=r.left-12-cw/2;else x=r.right+12+cw/2;}});
    el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-100%)';
    AVOID.push({left:x-cw/2,right:x+cw/2,top:y-chh,bottom:y,width:cw});
  });
  renderer.render(room,rcam);
}

function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),.05);time+=dt;
  if(inside){renderRoom(dt);return;}
  var kk=1-Math.exp(-dt*(reduce?30:2.4)),P=PAL[seasonKey];
  for(var k in MATS)MATS[k].color.lerp(tc.set(P[k]),kk);
  foliageS+=(P.fol-foliageS)*kk;if(Math.abs(foliageS-lastFol)>.002){placeTrees(foliageS);lastFol=foliageS;}
  nightV+=(nightT-nightV)*kk;
  skyDay.lerp(tc.set(P.sky),kk);skyC.copy(skyDay).lerp(SKY_NIGHT,nightV);
  scene.background.copy(skyC);scene.fog.color.copy(skyC);
  document.documentElement.style.setProperty('--sky','#'+skyC.getHexString());
  hemi.intensity=.6-.3*nightV;hemi.color.copy(HEMI_DAY).lerp(HEMI_NIGHT,nightV);hemi.groundColor.copy(HG_DAY).lerp(HG_NIGHT,nightV);
  sun.intensity=1.05-.8*nightV;sun.color.copy(SUN_C_DAY).lerp(SUN_C_NIGHT,nightV);
  sun.position.copy(sun.target.position).add(v3.copy(SUN_DAY).lerp(SUN_NIGHT,nightV));
  lampLights.forEach(function(l){l.intensity=nightV*1.4;});
  bulbM.color.setHex(0xe8e4d0).lerp(tc.set(0xffe9a0),nightV);
  NIGHT.forEach(function(m){m.emissiveIntensity=nightV;});
  GLASS.forEach(function(m){m.envMapIntensity=m.userData.env*(1-.75*nightV);});

  if(fly){fly.t+=dt/fly.dur;var e=ease(Math.min(1,fly.t));camera.position.lerpVectors(fly.fp,fly.tp,e);controls.target.lerpVectors(fly.ft,fly.tt,e);if(fly.t>=1)fly=null;}
  controls.target.x=Math.max(-320,Math.min(140,controls.target.x));controls.target.z=Math.max(-250,Math.min(250,controls.target.z));
  controls.update();
  var dist=camera.position.distanceTo(controls.target);
  scene.fog.near=dist*.9;scene.fog.far=dist+380;
  // scroll in on the campus to go inside
  if(!entering&&!fly&&dist<28&&inSite(controls.target))enterRoom();
  if(hintShown&&dist<60){hintShown=false;$('hint').style.opacity=0;}

  var C=PCFG[seasonKey];pcTmp.set(C.c);pMat.color.lerp(pcTmp,kk);pMat.size+=(C.size-pMat.size)*kk;
  var op=seasonKey==='summer'?(.15+.75*nightV):C.op;pMat.opacity+=(op-pMat.opacity)*kk;
  pCur.fall+=(C.fall-pCur.fall)*kk;pCur.sway+=(C.sway-pCur.sway)*kk;
  var pd=reduce?0:dt;
  for(var i=0;i<PN;i++){var ix=i*3;pPos[ix]+=Math.sin(time*.7+pPh[i])*pCur.sway*pd;pPos[ix+1]-=pCur.fall*pd;pPos[ix+2]+=Math.cos(time*.6+pPh[i]*1.3)*pCur.sway*pd*.6;
    if(pPos[ix+1]<0)pPos[ix+1]=50;else if(pPos[ix+1]>50)pPos[ix+1]=0;}
  pGeo.attributes.position.needsUpdate=true;

  if(!reduce){updateCars(dt);boats.forEach(function(b){b.g.position.z+=b.dir*b.sp*dt;if(b.g.position.z>500)b.g.position.z=-500;if(b.g.position.z<-500)b.g.position.z=500;});}

  var w=window.innerWidth,h=window.innerHeight;
  Object.keys(tags).forEach(function(id){v3.copy(tagPos[id]).project(camera);var t=tags[id];
    if(v3.z>1||v3.z<-1){t.style.visibility='hidden';return;}t.style.visibility='visible';
    t.style.transform='translate('+((v3.x*.5+.5)*w).toFixed(1)+'px,'+((-v3.y*.5+.5)*h).toFixed(1)+'px) translate(-50%,-50%)';});
  renderer.render(scene,camera);
}
frame();
})();
</script>
